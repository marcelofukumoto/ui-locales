  branding: ブランディングにより、管理者はRancher製品名、ロゴ、カラースキームをカスタマイズしてUIをグローバルに再ブランド化できます。
  chart: 特に記載がない限り、すべてのチャートには、LinuxおよびWindowsノードを持つクラスターにインストール可能なバージョンが少なくとも1つあります。
  compliance.cattle.io.clusterscanbenchmark: ベンチマークバージョンは、kube-benchを使用して実行するベンチマークの名前と、そのベンチマークの有効な設定パラメーターです。
  compliance.cattle.io.clusterscanprofile: プロファイルはコンプライアンススキャンの設定であり、使用するベンチマークバージョンとそのベンチマークでスキップする特定のテストを指定します。
  compliance.cattle.io.clusterscan: スキャンは、定義されたプロファイルに基づいてクラスターのコンプライアンススキャンをトリガーするために作成されます。スキャン完了後にレポートが作成されます。
  compliance.cattle.io.clusterscanreport: レポートはクラスターのコンプライアンススキャンの結果です。
  management.cattle.io.feature: 機能フラグにより、特定の{vendor}機能のオン/オフを切り替えることができます。デフォルトでオフの機能は実験的な機能と見なしてください。
  cluster.x-k8s.io.machine: マシンはKubernetesノードの設定をカプセル化します。クラスターを更新した後に何が起こるかを確認するには、このビューを使用します。
  cluster.x-k8s.io.machinedeployment: マシンDeploymentは、マシンセットのコレクション上でテンプレートを介したデプロイメントを調整します（Deploymentに類似）。クラスターを更新した後に何が起こるかを確認するには、このビューを使用します。
  cluster.x-k8s.io.machineset: マシンセットは、目的の数のマシンリソースが常に実行されていることを保証します（ReplicaSetに類似）。クラスターを更新した後に何が起こるかを確認するには、このビューを使用します。
  resources.cattle.io.backup: バックアップは、ResourceSetに基づく1回限りのバックアップまたは定期バックアップをスケジュールするために作成されます。
  resources.cattle.io.restore: リストアは、バックアップファイルに基づいてクラスターへのリストアをトリガーするために作成されます。
  resources.cattle.io.resourceset: リソースセットは、バックアップに保存するCRDとリソースを定義します。
  monitoring.coreos.com.servicemonitor: サービスモニターは、Prometheusがメトリクスをスクレイプするサービスのグループとエンドポイントを定義します。これはメトリクス収集を定義する最も一般的な方法です。
  monitoring.coreos.com.podmonitor: Podモニターは、PrometheusがメトリクスをスクレイプするPodのグループを定義します。一般的にはサービスモニターを使用しますが、Podモニターによりサービスモニターが機能しない状況に対応できます。
  monitoring.coreos.com.prometheusrule: PrometheusRuleリソースは、記録ルールやアラートルールを定義します。記録ルールは値を事前計算して保存できます。アラートルールはAlertManagerへの通知送信条件を定義できます。
  monitoring.coreos.com.prometheus: Prometheusサーバーは、選択されたServiceMonitor、PodMonitor、PrometheusRuleによってスクレイプ設定とルールが決定され、カスタムリソースの設定でアラートが選択されたすべてのAlertmanagerに送信されるPrometheusデプロイメントです。
  monitoring.coreos.com.alertmanager: Alertmanagerは、同じ名前空間のシークレットによって設定が指定されるデプロイメントであり、どのアラートをどのレシーバーに送るかを決定します。
  node: ベースのKubernetesノードリソースは、デプロイメントをホストする仮想または物理マシンを表します。マシンのライフサイクルを管理するには、利用可能な場合はクラスター管理に移動してください。
  catalog.cattle.io.clusterrepo: チャートリポジトリは、HelmリポジトリまたはGitベースの{vendor}アプリカタログです。クラスターで利用可能なチャートのリストを提供します。
  catalog.cattle.io.clusterrepo.local: ' チャートリポジトリは、HelmリポジトリまたはGitベースの{vendor}アプリカタログです。クラスターで利用可能なチャートのリストを提供します。クラスターテンプレートはHelmチャートを介してデプロイされます。'
  catalog.cattle.io.operation: 操作は、クラスターに適用された最近のHelm操作のリストです。
  catalog.cattle.io.app: インストール済みアプリケーションは、チャートまたはHelm CLIを介してインストールされたHelm 3チャートです。
  logging.banzaicloud.io.clusterflow: クラスターからのログが収集され、選択したクラスター出力にログが記録されます。
  logging.banzaicloud.io.clusteroutput: クラスター出力は、ログを送信できるログプロバイダーを定義し、ロギングオペレーターがある名前空間にデプロイされている場合のみ有効です。
  logging.banzaicloud.io.flow: フローは、収集・フィルタリングするログとログを送信する出力を定義します。フローは名前空間リソースであり、フローがデプロイされた名前空間からのみログが収集されます。
  logging.banzaicloud.io.output: 出力は、ログを送信できるログプロバイダーを定義します。出力は、それを使用するフローと同じ名前空間にある必要があります。
  group.principal: グループへのグローバルロールの割り当ては、グループをサポートする外部認証プロバイダーでのみ機能します。ローカル認証はグループをサポートしていません。
  management.cattle.io.oidcclient: ここでRancherのシングルサインオンIDプロバイダーにアプリケーションを追加できます
  auditlog.cattle.io.auditpolicy: どのRancher APIイベントをログに記録するか、およびその詳細レベルを決定するルールを定義します。
