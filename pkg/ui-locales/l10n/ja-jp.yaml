    description: UIはKubernetesリソースをローカルにキャッシュして再取得を避けます。場合によってはブラウザーに大量のデータが保存されることがあります。この設定を有効にして定期的に削除してください。
    checkboxLabel: ガベージコレクションを有効にする
    whenRun:
      description: ガベージコレクションの実行タイミングを更新
      intervalCheckBox:
        label: 定期的にガベージコレクションを実行
      interval:
        inputLabel: 実行間隔
      route:
        description: ページ変更時にガベージコレクションを実行
        inputLabel: ページ変更
    howRun:
      description: ガベージコレクションの実行方法を更新
      age:
        description: ガベージコレクションの対象と見なされるためには、リソースタイプがこの期間内にアクセスされていない必要があります。
        inputLabel: リソース有効期間
      count:
        description: ガベージコレクションの対象と見なされるためには、リソースタイプがこの数量を超える必要があります。
        inputLabel: リソース数
  nsFiltering:
    label: 名前空間/プロジェクトフィルタリングを要求
    description: ユーザーに名前空間やプロジェクトの選択を要求します。これによりリスト表示時に取得されるリソース数が制限され、多くのリソースを持つシステムでUIの応答性が向上します。
    checkboxLabel: 必須名前空間/プロジェクトフィルタリングを有効にする
    incompatibleDescription: 必須の名前空間/プロジェクトフィルタリングは手動更新およびインクリメンタルローディングと互換性がありません。これを有効にするとそれらが無効になります。
  advancedWorker:
    label: WebSocket Webワーカー
    description: UIにプッシュされるリソースの更新はWebSocketを介してUIスレッドで処理されます。このオプションを有効にして、クラスターのWebSocket更新を別スレッドのWebワーカーで処理します。これにより、リソースが頻繁に変更されるシステムでUIの応答性が向上します。
    checkboxLabel: 高度なWebSocket Webワーカーを有効にする
  inactivity:
    title: 非アクティブ
    checkboxLabel: 非アクティブセッション期限切れを有効にする
    inputLabel: 非アクティブタイムアウト（分）
    information: To change the automatic logout behaviour, edit the authorisation and/or session token timeout values (<code>auth-user-session-ttl-minutes</code> and <code>auth-token-max-ttl-minutes</code>) in the Settings page.
    description: 有効にして指定されたタイムアウト後にユーザーが非アクティブの場合、UIはページコンテンツを更新しなくなり、ユーザーは続行するためにページをリロードする必要があります。
