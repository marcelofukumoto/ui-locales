  serverPagination:
    label: サーバーサイドページネーション
    description: デフォルトではリストはすべてのリソースを取得し、ブラウザーでローカルにページネーション（ソートおよびフィルター設定に基づいてページを作成）します。サーバーサイドページネーションはこれをブラウザーからサーバーに移動します。これによりUIのパフォーマンスが向上し、特に多くのリソースを持つシステムで効果があります。
